services:
  # Python FastAPI InsightFace AI Service
  - type: web
    name: facetrack-python-ai
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_SECRET_KEY
        value: facetrack_ai_secret_key_2026_x89f
      - key: SIMILARITY_THRESHOLD
        value: "0.42"
